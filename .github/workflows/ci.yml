name: CI

on:
  push:
  pull_request:

jobs:
  check-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npx prettier --check .

      - name: Run lint
        run: npm run lint

      - name: Build electron
        run: npm run transpile:electron

      - name: Build
        run: npm run build
